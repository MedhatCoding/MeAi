name: Diagnose Streamlit startup

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".streamlit/**"
      - ".github/workflows/diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Execute app script with Streamlit AppTest
        env:
          AI_API_KEY: ""
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          app = AppTest.from_file("app.py", default_timeout=30).run()
          for error in app.exception:
              print("APP_EXCEPTION:", error.message)
          if app.exception:
              raise SystemExit("Streamlit app raised an exception during initial render.")
          print("PASS: app.py completed its initial render without uncaught exceptions.")
          PY
