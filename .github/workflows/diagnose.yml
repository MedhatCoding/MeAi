name: Diagnose Streamlit startup

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - ".streamlit/**"
      - ".github/workflows/diagnose.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py

      - name: Start Streamlit and capture startup logs
        shell: bash
        run: |
          set +e
          timeout 25s streamlit run app.py --server.headless true --server.port 8501 --server.address 127.0.0.1 > streamlit-startup.log 2>&1
          status=$?
          cat streamlit-startup.log
          if grep -Eqi "Traceback|ModuleNotFoundError|ImportError|SyntaxError|Error running app" streamlit-startup.log; then
            echo "Streamlit startup log contains an error."
            exit 1
          fi
          if grep -q "You can now view your Streamlit app" streamlit-startup.log; then
            echo "Streamlit server started successfully; timeout is expected for this smoke test."
            exit 0
          fi
          echo "Streamlit did not reach its ready message (exit status: $status)."
          exit 1
